<head>

<style>

    --muted: #8b93a1; --accent: #6c9bff; --accent-soft: #1c2740;
    --ok: #3ecf7a; --warn: #f0a03c; --bad: #f26d60; --star: #f0b43c;
    --shadow: 0 1px 3px rgba(0,0,0,.5); color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0f1115; --fg: #e6e8ec; --panel: #171a21; --border: #2a2f3a;
    --muted: #8b93a1; --accent: #6c9bff; --accent-soft: #1c2740;

  }

  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; }
  .app { display: flex; height: 100%; overflow: hidden; }

  .sidebar { width: 320px; min-width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-head h1 { margin: 0; font-size: 16px; }
  .sidebar-head .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .mode-tabs { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .mode-tabs button { flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .mode-tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .views { display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .views button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 4px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; }
  .views button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tree { flex: 1; overflow-y: auto; padding: 8px; }

  .chapter { margin-bottom: 2px; }
  .chapter-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 13px; }
  .chapter-head:hover { background: var(--accent-soft); }
  .chapter-head .arrow { transition: transform .15s; color: var(--muted); font-size: 10px; }
  .chapter.collapsed .arrow { transform: rotate(-90deg); }
  .chapter.collapsed .section-list { display: none; }
  .section-list { padding-left: 8px; }
  .section { margin-bottom: 1px; }
  .section-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px; cursor: pointer; border-radius: 6px; font-size: 13px; color: #3a4048; }
  .section-head:hover { background: var(--bg); }
  .section-head .arrow { transition: transform .15s; color: var(--muted); font-size: 9px; }
  .section.collapsed .arrow { transform: rotate(-90deg); }
  .section.collapsed .point-list { display: none; }
  .point-list { padding-left: 10px; }
  .point-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--fg); }
  .point-item:hover { background: var(--bg); }
  .point-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .point-item .cnt { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .point-item .done { color: var(--ok); font-size: 11px; font-variant-numeric: tabular-nums; }

  .year-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .year-item:hover { background: var(--bg); }
  .year-item.on { background: var(--accent-soft); color: var(--accent); }
  .year-item .cnt { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .topbar .crumb { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .topbar .crumb b { color: var(--fg); font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .topbar .nav-btns { display: flex; gap: 6px; }
  .topbar button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .topbar button:hover { background: var(--bg); }
  .topbar button:disabled { opacity: .4; cursor: default; }
  .menu-btn { display: none; }

  .stage { flex: 1; overflow-y: auto; padding: 18px; }
  .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); max-width: 900px; margin: 0 auto; padding: 18px 20px; }
  .qcard .qmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .qcard .qnum { font-weight: 700; font-size: 15px; }
  .qcard .qtag { color: var(--muted); font-size: 12px; }
  .qimg { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: #fff; overflow: hidden; }
  .qimg img { width: 100%; display: block; }
  .answer-zone { margin-top: 14px; }
  .answer-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; font-size: 14px; font-weight: 600; }
  .answer-box { margin-top: 10px; display: none; }
  .answer-box.show { display: block; }
  .answer-box .ans-label { color: var(--accent); font-weight: 700; margin-bottom: 6px; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .mastery-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .mastery-group button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; }
  .mastery-group button.on { color: #fff; border-color: transparent; }
  .mastery-group button.mastered.on { background: var(--ok); }
  .mastery-group button.practice.on { background: var(--warn); }
  .mastery-group button.notknown.on { background: var(--bad); }
  .fav-btn { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .fav-btn.on { background: color-mix(in srgb, var(--star) 14%, var(--panel)); border-color: var(--star); color: var(--star); }
  .note-btn { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .note-btn.has { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .hint { text-align: center; color: var(--muted); padding: 40px 20px; line-height: 1.8; }
  .stat-bar { font-size: 12px; color: var(--muted); margin-top: 12px; }

  .list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .list-item { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  .list-item:hover { border-color: var(--accent); }
  .list-item .yr { font-weight: 700; color: var(--accent); min-width: 46px; }
  .list-item .ttl { flex: 1; min-width: 0; }
  .list-item .st { font-size: 12px; }
  .st.mastered { color: var(--ok); } .st.practice { color: var(--warn); } .st.notknown { color: var(--bad); } .st.fav { color: var(--star); }

  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9; }

  /* note modal */
  .note-modal { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); padding: 12px; }
  .note-modal.show { display: flex; align-items: center; justify-content: center; }
  .note-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 1120px; height: 94%; display: flex; flex-direction: column; overflow: hidden; }
  .note-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .note-head .ttl { font-weight: 700; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-head .spacer { flex: 1; }
  .note-close { border: none; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; padding: 2px 8px; }
  .note-close:hover { color: var(--fg); }
  .note-body { flex: 1; display: flex; gap: 12px; padding: 12px 16px; overflow: hidden; min-height: 0; }
  .note-q { flex: 1; min-width: 0; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .note-q img { width: 100%; display: block; }
  .note-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .note-toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .note-toolbar button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .note-toolbar button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .size-btn { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
  .size-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; padding: 0; flex-shrink: 0; }
  .color-dot.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .note-canvas-wrap { flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .note-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .note-text { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font: inherit; color: var(--fg); background: var(--panel); }
  .note-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .note-foot .hint { padding: 0; color: var(--muted); font-size: 12px; }
  .note-foot .spacer { flex: 1; }
  .note-foot button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .note-foot button:hover { background: var(--bg); }
  .note-foot button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .note-foot button.danger { color: var(--bad); }

  @media (max-width: 820px) {
    .sidebar { position: fixed; z-index: 10; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
    .sidebar.open { transform: translateX(0); }
    .scrim.show { display: block; }
    .menu-btn { display: inline-block; }
    .note-body { flex-direction: column; overflow-y: auto; }
    .note-q { flex: none; max-height: 38vh; }
    .note-side { flex: none; }
    .note-canvas-wrap { min-height: 320px; }
  }

</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h1>858 信号与系统真题</h1>
      <div class="sub">2015–2025 · 三级知识点分类 + 按年份</div>
    </div>
    <div class="mode-tabs">
      <button id="modePoint" class="on" onclick="window.__mode('point')">按知识点</button>
      <button id="modeYear" onclick="window.__mode('year')">按年份</button>
    </div>
    <div class="views" id="viewsRow">
      <button data-view="all" class="on">全部</button>
      <button data-view="favorites">收藏</button>
      <button data-view="review">复习</button>
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>
  <div class="scrim" id="scrim" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('show')"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" onclick="document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show')">☰</button>
      <span class="crumb" id="crumb">请选择知识点或年份</span>
      <span class="spacer"></span>
      <button id="listToggle" title="列表/单题切换">列表</button>
      <div class="nav-btns">
        <button id="prevBtn" disabled>‹ 上一题</button>
        <button id="nextBtn" disabled>下一题 ›</button>
      </div>
    </div>
    <div class="stage" id="stage"><div class="hint">加载中…</div></div>
  </main>
</div>

<div class="note-modal" id="noteModal">
  <div class="note-card">
    <div class="note-head"><span class="ttl" id="noteTitle">笔记</span><span class="spacer"></span><button class="note-close" onclick="window.__closeNote()">×</button></div>
    <div class="note-body">
      <div class="note-q"><img id="noteQImg" alt="原题"></div>
      <div class="note-side">
        <div class="note-toolbar">
          <button id="penBtn" class="on" onclick="window.__tool('pen')">笔</button>
          <button id="eraserBtn" onclick="window.__tool('eraser')">橡皮</button>
          <span style="width:6px"></span>
          <button class="size-btn" data-size="3" onclick="window.__size(this)">细</button>
          <button class="size-btn on" data-size="5" onclick="window.__size(this)">中</button>
          <button class="size-btn" data-size="8" onclick="window.__size(this)">粗</button>
          <span style="width:6px"></span>
          <button class="color-dot on" data-color="#1a1d23" style="background:#1a1d23" onclick="window.__color(this)"></button>
          <button class="color-dot" data-color="#1f5eff" style="background:#1f5eff" onclick="window.__color(this)"></button>
          <button class="color-dot" data-color="#d92d20" style="background:#d92d20" onclick="window.__color(this)"></button>
          <button class="color-dot" data-color="#12994f" style="background:#12994f" onclick="window.__color(this)"></button>
          <span style="flex:1"></span>
          <button onclick="window.__undo()">撤销</button>
          <button onclick="window.__clearCanvas()">清空</button>
        </div>
        <div class="note-canvas-wrap" id="noteCanvasWrap"><canvas class="note-canvas" id="noteCanvas"></canvas></div>
        <textarea class="note-text" id="noteText" placeholder="文字笔记（可选）"></textarea>
      </div>
    </div>
    <div class="note-foot">
      <span class="hint">用笔 / 手指涂写，自动保存到本机浏览器</span>
      <span class="spacer"></span>
      <button class="danger" onclick="window.__clearNote()">删除笔记</button>
      <button class="primary" onclick="window.__saveNote()">保存</button>
    </div>
  </div>
</div>

": ["p421", "p411"], "q": "_img/q_2025_五.png", "a": "_img/a_2025_五.png"}, {"id": "2025_六", "year": 2025, "da": "六", "xiao": 0, "points": ["p551"], "q": "_img/q_2025_六.png", "a": "_img/a_2025_六.png"}, {"id": "2025_七", "year": 2025, "da": "七", "xiao": 0, "points": ["p711"], "q": "_img/q_2025_七.png", "a": "_img/a_2025_七.png"}, {"id": "2025_八", "year": 2025, "da": "八", "xiao": 0, "points": ["p561", "p541"], "q": "_img/q_2025_八.png", "a": "_img/a_2025_八.png"}]};
</script>
<script>
(function () {
  var D = window.DAGUAN_DATA;
  var chapters = D.chapters, questions = D.questions, years = D.years;
  var qById = {}; questions.forEach(function(q){ qById[q.id] = q; });
  var pointMap = {}; questions.forEach(function(q){ (q.points || [q.point]).forEach(function(p){ (pointMap[p] = pointMap[p] || []).push(q.id); }); });
  var yearMap = {}; questions.forEach(function(q){ (yearMap[q.year] = yearMap[q.year] || []).push(q.id); });
  var pointTitle = {};
  chapters.forEach(function(c){ c.sections.forEach(function(s){ s.points.forEach(function(p){ pointTitle[p.id] = p.title; }); }); });

  var STORE_KEY = 'daguan-858-v2';
  var state = load();
  function load() { try { var s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.q) return s; } catch (e) {} return { q: {}, view: 'all', listMode: false, mode: 'point' }; }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  var currentMode = state.mode || 'point';
  var currentGroup = null, currentSeq = [], currentIdx = -1;

  function qState(id) { return state.q[id] || { mastery: 'not_started', fav: false }; }
  function setMastery(id, m) { var s = qState(id); s.mastery = (s.mastery === m) ? 'not_started' : m; state.q[id] = s; save(); renderSidebar(); renderQuestion(); }
  function toggleFav(id) { var s = qState(id); s.fav = !s.fav; state.q[id] = s; save(); renderSidebar(); renderQuestion(); }
  function visibleIds() {
    return questions.filter(function(q){
      if (state.view === 'favorites') return qState(q.id).fav;
      if (state.view === 'review') return ['needs_practice','not_known'].indexOf(qState(q.id).mastery) >= 0;
      return true;
    }).map(function(q){ return q.id; });
  }
  function groupIds(g) {
    if (String(g)[0] === 'y') return yearMap[parseInt(String(g).slice(1))] || [];
    return pointMap[g] || [];
  }
  function doneCount(g) { return groupIds(g).filter(function(id){ return qState(id).mastery === 'mastered'; }).length; }
  function totalCount(g) { return groupIds(g).filter(function(id){ return visibleIds().indexOf(id) >= 0; }).length; }

  function renderSidebar() {
    var el = document.getElementById('tree');
    el.innerHTML = '';
    if (currentMode === 'year') { renderYears(el); } else { renderTree(el); }
  }
  function renderTree(el) {
    chapters.forEach(function(c){
      var ch = document.createElement('div'); ch.className = 'chapter';
      ch.innerHTML = '<div class="chapter-head"><span class="arrow">▼</span><span></span></div><div class="section-list"></div>';
      ch.querySelector('.chapter-head span:last-child').textContent = c.title;
      ch.querySelector('.chapter-head').onclick = function(){ ch.classList.toggle('collapsed'); };
      var slist = ch.querySelector('.section-list');
      c.sections.forEach(function(s){
        var sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = '<div class="section-head"><span class="arrow">▼</span><span></span></div><div class="point-list"></div>';
        sec.querySelector('.section-head span:last-child').textContent = s.title;
        sec.querySelector('.section-head').onclick = function(){ sec.classList.toggle('collapsed'); };
        var plist = sec.querySelector('.point-list');
        s.points.forEach(function(p){
          var item = document.createElement('div');
          item.className = 'point-item' + (p.id === currentGroup ? ' on' : '');
          item.innerHTML = '<span></span><span class="done"></span><span class="cnt"></span>';
          item.querySelector('span:first-child').textContent = p.title;
          item.querySelector('.done').textContent = (function(){ var d = doneCount(p.id); return d ? d + '/' : ''; })();
          item.querySelector('.cnt').textContent = totalCount(p.id);
          item.onclick = function(){ selectGroup(p.id); };
          plist.appendChild(item);
        });
        slist.appendChild(sec);
      });
      el.appendChild(ch);
    });
  }
  function renderYears(el) {
    years.forEach(function(y){
      var item = document.createElement('div');
      item.className = 'year-item' + ('y' + y === currentGroup ? ' on' : '');
      item.innerHTML = '<span>' + y + ' 年</span><span class="cnt"></span>';
      item.querySelector('.cnt').textContent = doneCount('y' + y) + ' / ' + totalCount('y' + y);
      item.onclick = function(){ selectGroup('y' + y); };
      el.appendChild(item);
    });
  }

  function selectGroup(g) {
    currentGroup = g;
    var seq = groupIds(g).filter(function(id){ return visibleIds().indexOf(id) >= 0; });
    if (!seq.length) { currentSeq = []; currentIdx = -1; document.getElementById('stage').innerHTML = '<div class="hint">当前视图下没有题目</div>'; renderSidebar(); updateCrumb(); return; }
    currentSeq = seq; currentIdx = 0;
    renderSidebar(); renderQuestion();
  }

  function qLabel(q) {
    if (q.xiao) return q.da + '、' + q.xiao;
    if (q.year >= 2023 && q.da.indexOf('第') === 0) return q.da;
    return q.da;
  }

  function renderQuestion() {
    var stage = document.getElementById('stage');
    if (currentIdx < 0 || currentIdx >= currentSeq.length) { stage.innerHTML = '<div class="hint">请选择知识点或年份</div>'; return; }
    var q = qById[currentSeq[currentIdx]], st = qState(q.id);
    var hasNote = !!(st.note && (st.note.text || st.note.drawing));
    var pos = (currentIdx + 1) + ' / ' + currentSeq.length;
    if (state.listMode) { renderList(); updateCrumb(); return; }
    var pts = (q.points || [q.point]).map(function(p){ return pointTitle[p] || ''; }).filter(Boolean).join(' · ');
    var ansHtml = q.a
      ? '<div class="answer-zone"><button class="answer-btn" id="ansBtn">显示答案</button><div class="answer-box" id="ansBox"><div class="ans-label">参考答案</div><img class="qimg" src="' + q.a + '" alt="答案" loading="lazy"></div></div>'
      : '<div class="answer-zone"><p style="color:var(--muted);font-size:12px">此题（扫描版）答案与题目同页。</p></div>';
    stage.innerHTML =
      '<div class="qcard">' +
        '<div class="qmeta"><span class="qnum">' + q.year + '年 · ' + qLabel(q) + '</span><span class="qtag">' + pos + '　' + pts + '</span></div>' +
        '<div class="qimg"><img src="' + q.q + '" alt="' + q.year + ' ' + qLabel(q) + '"></div>' + ansHtml +
        '<div class="controls"><span style="color:var(--muted);font-size:12px">掌握：</span>' +
          '<div class="mastery-group">' +
            '<button class="mastered' + (st.mastery==='mastered'?' on':'') + '" onclick="window.__setM(\'' + q.id + '\',\'mastered\')">已掌握</button>' +
            '<button class="practice' + (st.mastery==='needs_practice'?' on':'') + '" onclick="window.__setM(\'' + q.id + '\',\'needs_practice\')">需练习</button>' +
            '<button class="notknown' + (st.mastery==='not_known'?' on':'') + '" onclick="window.__setM(\'' + q.id + '\',\'not_known\')">不会</button>' +
          '</div>' +
          '<button class="fav-btn' + (st.fav?' on':'') + '" onclick="window.__fav(\'' + q.id + '\')">' + (st.fav?'★ 已收藏':'☆ 收藏') + '</button>' +
          '<button class="note-btn' + (hasNote?' has':'') + '" onclick="window.__note(\'' + q.id + '\')">' + (hasNote?'✎ 笔记 ✓':'✎ 笔记') + '</button>' +
        '</div>' +
        '<div class="stat-bar">本组进度：' + doneCount(currentGroup) + ' / ' + totalCount(currentGroup) + ' 已掌握</div>' +
      '</div>';
    if (q.a) {
      document.getElementById('ansBtn').onclick = function(){
        var box = document.getElementById('ansBox');
        var show = box.classList.toggle('show');
        document.getElementById('ansBtn').textContent = show ? '隐藏答案' : '显示答案';
      };
    }
    updateCrumb();
    document.getElementById('prevBtn').disabled = currentIdx <= 0;
    document.getElementById('nextBtn').disabled = currentIdx >= currentSeq.length - 1;
  }

  function renderList() {
    var stage = document.getElementById('stage');
    if (!currentGroup) { stage.innerHTML = '<div class="hint">请选择知识点或年份</div>'; return; }
    var html = '<div class="list">';
    currentSeq.forEach(function(id, i){
      var q = qById[id], st = qState(id);
      var cls = st.mastery==='mastered'?'mastered':st.mastery==='needs_practice'?'practice':st.mastery==='not_known'?'notknown':'';
      var badge = st.mastery==='mastered'?'✓':st.mastery==='needs_practice'?'练':st.mastery==='not_known'?'✗':'';
      html += '<div class="list-item" onclick="window.__jump(' + i + ')"><span class="yr">' + q.year + '</span><span class="ttl">' + qLabel(q) + ' · ' + (pointTitle[(q.points||[q.point])[0]]||'') + '</span><span class="st ' + cls + '">' + (st.fav?'★ ':'') + badge + '</span></div>';
    });
    stage.innerHTML = html + '</div>';
    updateCrumb();
  }

  function updateCrumb() {
    var c = document.getElementById('crumb');
    if (!currentGroup) { c.innerHTML = '请选择知识点或年份'; return; }
    var gname = (String(currentGroup)[0] === 'y') ? (String(currentGroup).slice(1) + ' 年真题') : pointTitle[currentGroup];
    var q = currentIdx >= 0 ? qById[currentSeq[currentIdx]] : null;
    c.innerHTML = '<b>' + gname + '</b>' + (q ? '　·　' + q.year + '年 ' + qLabel(q) : '');
  }

  window.__mode = function(m) {
    currentMode = m; state.mode = m; save();
    document.getElementById('modePoint').classList.toggle('on', m === 'point');
    document.getElementById('modeYear').classList.toggle('on', m === 'year');
    currentGroup = null; currentSeq = []; currentIdx = -1;
    document.getElementById('stage').innerHTML = '<div class="hint">' + (m === 'point' ? '选一个知识点开始刷题' : '选一个年份开始刷题') + '</div>';
    document.getElementById('crumb').innerHTML = '请选择知识点或年份';
    renderSidebar();
  };

  window.__setM = setMastery;
  window.__fav = toggleFav;
  window.__jump = function(i){ currentIdx = i; state.listMode = false; renderQuestion(); };
  window.__prev = function(){ if (currentIdx > 0) { currentIdx--; renderQuestion(); } };
  window.__next = function(){ if (currentIdx < currentSeq.length-1) { currentIdx++; renderQuestion(); } };

  // ---- 笔记 ----
  var noteCanvas, noteCtx, noteColor = '#1a1d23', noteSize = 5, noteEraser = false, noteDrawing = false, noteLast = null, noteUndo = [];
  var currentNoteId = null;
  function noteEl(id) { return document.getElementById(id); }
  function cw() { return noteCanvas.clientWidth; } function ch() { return noteCanvas.clientHeight; }
  function whiteFill() { noteCtx.fillStyle = '#fff'; noteCtx.fillRect(0, 0, cw(), ch()); }
  function canvasPos(e) { var r = noteCanvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function setupCanvas() {
    noteCanvas = noteEl('noteCanvas');
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(280, noteEl('noteCanvasWrap').clientWidth), h = Math.max(240, noteEl('noteCanvasWrap').clientHeight);
    noteCanvas.width = Math.round(w * dpr); noteCanvas.height = Math.round(h * dpr);
    noteCtx = noteCanvas.getContext('2d');
    noteCtx.scale(dpr, dpr); noteCtx.lineCap = 'round'; noteCtx.lineJoin = 'round';
    whiteFill(); noteUndo = [];
    if (!noteCanvas._bound) {
      noteCanvas._bound = true;
      noteCanvas.addEventListener('pointerdown', function(e){ noteDrawing = true; noteUndo.push(noteCanvas.toDataURL('image/png')); if (noteUndo.length > 25) noteUndo.shift(); noteLast = canvasPos(e); e.preventDefault(); });
      noteCanvas.addEventListener('pointermove', function(e){ if (!noteDrawing) return; var p = canvasPos(e); noteCtx.strokeStyle = noteEraser ? '#fff' : noteColor; noteCtx.globalCompositeOperation = noteEraser ? 'destination-out' : 'source-over'; noteCtx.lineWidth = noteEraser ? 40 : noteSize; noteCtx.beginPath(); noteCtx.moveTo(noteLast.x, noteLast.y); noteCtx.lineTo(p.x, p.y); noteCtx.stroke(); noteLast = p; e.preventDefault(); });
      function endDraw(){ noteDrawing = false; noteCtx.globalCompositeOperation = 'source-over'; }
      noteCanvas.addEventListener('pointerup', endDraw);
      noteCanvas.addEventListener('pointercancel', endDraw);
      noteCanvas.addEventListener('pointerleave', endDraw);
    }
  }
  window.__note = function(id) {
    currentNoteId = id;
    var q = qById[id], st = qState(id), note = st.note || {};
    noteEl('noteTitle').textContent = '笔记 · ' + q.year + '年 ' + qLabel(q);
    noteEl('noteQImg').src = q.q;
    noteEl('noteText').value = note.text || '';
    noteEl('noteModal').classList.add('show');
    setupCanvas();
    if (note.drawing) { var img = new Image(); img.onload = function(){ whiteFill(); noteCtx.drawImage(img, 0, 0, cw(), ch()); }; img.src = note.drawing; }
  };
  window.__closeNote = function(){ noteEl('noteModal').classList.remove('show'); currentNoteId = null; };
  window.__saveNote = function() {
    if (!currentNoteId) return;
    var s = qState(currentNoteId);
    var txt = noteEl('noteText').value;
    var drawn = noteUndo.length > 0;
    var drawing = drawn ? noteCanvas.toDataURL('image/png') : ((s.note && s.note.drawing) || null);
    if (txt || drawing) s.note = { text: txt, drawing: drawing }; else delete s.note;
    state.q[currentNoteId] = s; save(); renderSidebar(); renderQuestion();
    noteEl('noteModal').classList.remove('show'); currentNoteId = null;
  };
  window.__clearNote = function() {
    if (!currentNoteId) return;
    var s = qState(currentNoteId);
    delete s.note; state.q[currentNoteId] = s; save(); renderSidebar(); renderQuestion();
    noteEl('noteModal').classList.remove('show'); currentNoteId = null;
  };
  window.__tool = function(t) { noteEraser = (t === 'eraser'); noteEl('penBtn').classList.toggle('on', !noteEraser); noteEl('eraserBtn').classList.toggle('on', noteEraser); };
  window.__size = function(btn) { noteSize = parseInt(btn.dataset.size, 10) || 5; Array.prototype.forEach.call(document.querySelectorAll('.size-btn'), function(b){ b.classList.remove('on'); }); btn.classList.add('on'); };
  window.__color = function(btn) { noteColor = btn.dataset.color; Array.prototype.forEach.call(document.querySelectorAll('.color-dot'), function(b){ b.classList.remove('on'); }); btn.classList.add('on'); };
  window.__undo = function() { if (!noteUndo.length) return; var prev = noteUndo.pop(); var img = new Image(); img.onload = function(){ whiteFill(); noteCtx.drawImage(img, 0, 0, cw(), ch()); }; img.src = prev; };
  window.__clearCanvas = function() { noteUndo.push(noteCanvas.toDataURL('image/png')); whiteFill(); };

  document.getElementById('prevBtn').onclick = function(){ window.__prev(); };
  document.getElementById('nextBtn').onclick = function(){ window.__next(); };
  document.getElementById('listToggle').onclick = function(){
    state.listMode = !state.listMode;
    this.textContent = state.listMode ? '单题' : '列表';
    if (currentGroup) { state.listMode ? renderList() : renderQuestion(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('.views button'), function(b){
    b.onclick = function(){
      Array.prototype.forEach.call(document.querySelectorAll('.views button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on'); state.view = b.dataset.view; save();
      if (currentGroup) selectGroup(currentGroup); else renderSidebar();
    };
  });
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') window.__prev();
    if (e.key === 'ArrowRight') window.__next();
    if (e.key === 'ArrowDown') { var b = document.getElementById('ansBtn'); if (b) b.click(); }
  });

  renderSidebar();
  document.getElementById('stage').innerHTML = '<div class="hint">在左侧选一个知识点（或切到「按年份」）开始刷题。<br>题目为真题 PDF 原图；点「显示答案」看解析；「✎ 笔记」可涂写记录。</div>';
})();
</script>
